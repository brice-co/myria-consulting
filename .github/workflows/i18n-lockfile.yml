name: Regenerate pnpm lockfile (i18n draft)
on:
  push:
    branches:
      - seo/french-market-pages-2026-10
    paths:
      - package.json
      - pnpm-workspace.yaml
      - .github/workflows/i18n-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@12.6.0 --activate
      - name: Update lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit updated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(i18n): regenerate pnpm lockfile for next-intl"
          git push origin HEAD:seo/french-market-pages-2026-10
