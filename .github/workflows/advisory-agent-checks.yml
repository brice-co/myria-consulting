name: Advisory LiveKit worker validation

on:
  pull_request:
    paths:
      - "services/advisory-voice-agent/**"
      - ".github/workflows/advisory-agent-checks.yml"
  workflow_dispatch:

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check syntax
        run: python -m compileall -q services/advisory-voice-agent
      - name: Test speaker router
        run: python -m unittest discover -s services/advisory-voice-agent/tests -p 'test_*.py' -v
