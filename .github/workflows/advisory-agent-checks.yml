name: Advisory LiveKit worker validation

on:
  pull_request:
    paths:
      - "services/advisory-voice-agent/**"
      - ".github/workflows/advisory-agent-checks.yml"
  workflow_dispatch:

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install -r services/advisory-voice-agent/requirements.txt
      - name: Verify LiveKit worker SDK imports and configuration
        working-directory: services/advisory-voice-agent
        run: |
          python -c "from livekit.agents import Agent, AgentServer, AgentSession, JobContext, room_io; from livekit.plugins import openai; assert hasattr(room_io, 'RoomOptions'); import agent; assert agent.server is not None"
      - name: Check syntax
        run: python -m compileall -q services/advisory-voice-agent
      - name: Test speaker router
        run: python -m unittest discover -s services/advisory-voice-agent/tests -p 'test_*.py' -v
